# Compila Wavestr: Android (APK) y escritorio (Linux .deb y .tar.gz, Windows .msi).
# - Push a main / pull request: tests, traducciones y APK en «Artifacts».
# - Push a la rama beta: «Wavestr Beta», otra app (io.github.oluengo.wavestr.beta) con sus propios datos,
#   versión X.Y.Z-beta.N. Se publica como pre-release «Wavestr Beta» (etiqueta wavestr-beta, se rehace en cada push).
# - Etiqueta v* (p. ej. v0.1.0, igual que wavestrVersion en app/build.gradle.kts): Release con el APK firmado.
#   De ahí lo recogen Obtainium y Zapstore.
# Firma: secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# (los mismos nombres que en Usus). Sin ellos se genera un APK de depuración y no se publica nada.
name: Build

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publicar versión (crea la etiqueta vX.Y.Z y la Release con APK e instaladores; solo desde main)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WAVESTR_BETA: ${{ github.ref == 'refs/heads/beta' && '1' || '' }}
      WAVESTR_BETA_N: ${{ github.run_number }}
      # Versión normal: etiqueta v* empujada o «Publicar versión» desde Actions (en main).
      RELEASE: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')) && 'true' || '' }}
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Errores de compilación como anotaciones
        run: echo "::add-matcher::.github/kotlin-matcher.json"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Comprobar traducciones (ca/es/en)
        run: python3 scripts/check_strings.py

      - name: Tests unitarios
        run: ./gradlew :core:test testDebugUnitTest --stacktrace

      - name: Versión
        id: v
        run: |
          v="$(sed -n 's/^val wavestrVersion = "\(.*\)"/\1/p' app/build.gradle.kts)"
          if [ "$WAVESTR_BETA" = "1" ]; then
            echo "version=$v-beta.$WAVESTR_BETA_N" >> "$GITHUB_OUTPUT"; echo "file=wavestr-beta" >> "$GITHUB_OUTPUT"
          else
            echo "version=$v" >> "$GITHUB_OUTPUT"; echo "file=wavestr" >> "$GITHUB_OUTPUT"
          fi
          if [ "$WAVESTR_BETA" = "1" ]; then echo "tag=wavestr-beta" >> "$GITHUB_OUTPUT"; elif [ "$RELEASE" = "true" ]; then echo "tag=v$v" >> "$GITHUB_OUTPUT"; fi

      - name: Comprobar que la etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con wavestrVersion ${{ steps.v.outputs.version }}"; exit 1
          fi

      - name: Clave de firma
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/wavestr.jks"
            echo "WAVESTR_KEYSTORE=$RUNNER_TEMP/wavestr.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sin clave de firma: se genera un APK de depuración y no se publica nada."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar (firmado)
        if: steps.key.outputs.signed == 'true'
        env:
          WAVESTR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WAVESTR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WAVESTR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in WAVESTR_KEYSTORE_PASSWORD WAVESTR_KEY_ALIAS WAVESTR_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secret de firma correspondiente a $v"; exit 1; fi
          done
          # Diagnóstico sin mostrar secretos: tamaño y tipo del archivo, si abre la contraseña y qué alias contiene.
          echo "Keystore: $(stat -c %s "$WAVESTR_KEYSTORE") bytes · $(file -b "$WAVESTR_KEYSTORE" | cut -c1-60)"
          if ! keytool -list -keystore "$WAVESTR_KEYSTORE" -storepass "$WAVESTR_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/kt.out" 2>&1; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD no abre el keystore (o ANDROID_KEYSTORE_BASE64 no es un keystore válido): $(grep -i 'error' "$RUNNER_TEMP/kt.out" | head -c 300)"; exit 1
          fi
          aliases=$(grep -iE 'PrivateKeyEntry' "$RUNNER_TEMP/kt.out" | cut -d, -f1 | tr '\n' ' ')
          if ! keytool -list -keystore "$WAVESTR_KEYSTORE" -storepass "$WAVESTR_KEYSTORE_PASSWORD" -alias "$WAVESTR_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::ANDROID_KEY_ALIAS no coincide. Alias en el keystore: $aliases"; exit 1
          fi
          ./gradlew assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}.apk"

      - name: Compilar (depuración)
        if: steps.key.outputs.signed != 'true'
        run: |
          ./gradlew assembleDebug --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}-debug.apk"

      # Sin clave, comprobamos igualmente que la versión release (con R8) compila.
      - name: Comprobar release (R8, sin firmar)
        if: steps.key.outputs.signed != 'true'
        run: ./gradlew assembleRelease --stacktrace

      - name: Huella SHA-256 del certificado
        if: steps.key.outputs.signed == 'true'
        run: |
          f=$(ls dist/*.apk); bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs "$f" | grep -i sha-256 | tee dist/firma-sha256.txt
          rm -f "$RUNNER_TEMP/wavestr.jks"

      - name: Permisos del APK
        run: |
          f=$(ls dist/*.apk); bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/aapt2" dump permissions "$f" | tee dist/permisos.txt
          if grep -E "STORAGE|LOCATION|CAMERA|RECORD_AUDIO|CONTACTS" dist/permisos.txt; then echo "::error::Permiso no esperado"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}-android
          path: dist/
          if-no-files-found: error

      - name: Release de GitHub
        if: env.RELEASE == 'true' && steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"; tag="${{ steps.v.outputs.tag }}"
          awk -v v="$v" '$0 ~ "^## " v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > "$RUNNER_TEMP/notas.md"
          printf '\n---\nHuella del certificado: `%s`\n\nLinux y Windows: los instaladores se añaden unos minutos después del APK. Necesitan VLC.\n' "$(sed 's/.*: //' dist/firma-sha256.txt)" >> "$RUNNER_TEMP/notas.md"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk --clobber
            gh release edit "$tag" --title "Wavestr $v" --notes-file "$RUNNER_TEMP/notas.md"
          else
            gh release create "$tag" dist/*.apk --target "$GITHUB_SHA" --title "Wavestr $v" --notes-file "$RUNNER_TEMP/notas.md" --latest
          fi

      # Beta: una sola pre-release «Wavestr Beta» (etiqueta wavestr-beta) que se rehace en cada push; no cuenta como última versión.
      - name: Pre-release beta
        if: env.WAVESTR_BETA == '1' && steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete wavestr-beta --cleanup-tag --yes || true
          printf '%s\n\n%s\n' "**Versión de pruebas** ${{ steps.v.outputs.version }} · $(git log -1 --format=%s)" \
            "Se instala como otra app, «Wavestr Beta», con sus propios datos: no toca la Wavestr normal. Puede tener fallos. Los instaladores de Linux y Windows se añaden unos minutos después del APK." > "$RUNNER_TEMP/beta.md"
          gh release create wavestr-beta dist/*.apk --prerelease --target "$GITHUB_SHA" --title "Wavestr Beta ${{ steps.v.outputs.version }}" --notes-file "$RUNNER_TEMP/beta.md"

  # Escritorio: Compose Desktop + VLC. Cada sistema compila su instalador.
  desktop:
    name: Escritorio (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      WAVESTR_BETA: ${{ github.ref == 'refs/heads/beta' && '1' || '' }}
      WAVESTR_BETA_N: ${{ github.run_number }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Errores de compilación como anotaciones
        run: echo "::add-matcher::.github/kotlin-matcher.json"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Versión
        id: v
        run: |
          v="$(sed -n 's/^val wavestrVersion = "\(.*\)"/\1/p' app/build.gradle.kts)"
          if [ "$WAVESTR_BETA" = "1" ]; then
            echo "version=$v-beta.$WAVESTR_BETA_N" >> "$GITHUB_OUTPUT"; echo "file=wavestr-beta" >> "$GITHUB_OUTPUT"
          else
            echo "version=$v" >> "$GITHUB_OUTPUT"; echo "file=wavestr" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar VLC y xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends vlc-bin vlc-plugin-base vlc-plugin-video-output xvfb > /dev/null

      - name: Prueba de arranque (xvfb + VLC)
        if: runner.os == 'Linux'
        run: |
          ./gradlew :desktop:classes -q
          rm -f /tmp/wavestr_hs_err.log
          code=0
          WAVESTR_SMOKE=1 timeout -k 10 240 xvfb-run -a -s "-screen 0 1280x900x24" ./gradlew --no-daemon :desktop:run > "$RUNNER_TEMP/smoke.log" 2>&1 || code=$?
          grep -E "^::" "$RUNNER_TEMP/smoke.log" | grep -v "Escritorio paso" || echo "::warning::La prueba de arranque no dejó resultados"
          if [ -f /tmp/wavestr_hs_err.log ]; then
            frames=$( (grep -E "^# C|^Current thread" /tmp/wavestr_hs_err.log; grep -A14 -E "^Native frames" /tmp/wavestr_hs_err.log | tail -n +2) | head -18 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning::Fallo nativo%0A$frames"
          fi
          [ "$code" = 0 ] || echo "::warning::La prueba de arranque terminó con código $code"

      - name: Linux (.deb y .tar.gz)
        if: runner.os == 'Linux'
        run: |
          ./gradlew :desktop:packageDeb :desktop:createDistributable --stacktrace
          mkdir -p dist
          cp desktop/build/compose/binaries/main/deb/*.deb "dist/${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}-linux-amd64.deb"
          tar -C desktop/build/compose/binaries/main/app -czf "dist/${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}-linux-x64.tar.gz" .

      - name: Windows (.msi)
        if: runner.os == 'Windows'
        run: |
          ./gradlew :desktop:packageMsi --stacktrace
          mkdir -p dist
          cp desktop/build/compose/binaries/main/msi/*.msi "dist/${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}-windows-x64.msi"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: dist/
          if-no-files-found: error

  # Añade los instaladores de escritorio a la release (o a la pre-release beta) que acaba de crear el job de Android.
  publish-desktop:
    needs: [build, desktop]
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
      - name: Subir a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.build.outputs.tag }}"
          gh release upload "$tag" dist/* --clobber -R "${{ github.repository }}"

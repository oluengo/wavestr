# Builds Wavestr: Android (APK) and desktop (Linux .deb and .tar.gz, Windows .msi).
# - Push to main / pull request: tests, translations and APK in "Artifacts".
# - Push to the beta branch: "Wavestr Beta", a separate app (io.github.oluengo.wavestr.beta) with its own data,
#   version X.Y.Z-beta.N. Published as the "Wavestr Beta" pre-release (tag wavestr-beta, rebuilt on every push).
# - Tag v* (e.g. v0.1.0, matching wavestrVersion in app/build.gradle.kts): Release with the signed APK.
#   Obtainium and Zapstore pick it up from there.
# Signing: secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# (same names as in Usus). Without them a debug APK is built and nothing is published.
name: Build

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish release (creates the vX.Y.Z tag and the Release with APK and installers; main only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WAVESTR_BETA: ${{ github.ref == 'refs/heads/beta' && '1' || '' }}
      WAVESTR_BETA_N: ${{ github.run_number }}
      # Regular release: pushed v* tag or "Publish release" from Actions (on main).
      RELEASE: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')) && 'true' || '' }}
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v7

      - name: Build errors as annotations
        run: echo "::add-matcher::.github/kotlin-matcher.json"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Check translations (ca/es/en)
        run: python3 scripts/check_strings.py

      - name: Unit tests
        run: ./gradlew :core:test testDebugUnitTest --stacktrace

      - name: Version
        id: v
        run: |
          v="$(sed -n 's/^val wavestrVersion = "\(.*\)"/\1/p' app/build.gradle.kts)"
          if [ "$WAVESTR_BETA" = "1" ]; then
            echo "version=$v-beta.$WAVESTR_BETA_N" >> "$GITHUB_OUTPUT"; echo "file=wavestr-beta" >> "$GITHUB_OUTPUT"
          else
            echo "version=$v" >> "$GITHUB_OUTPUT"; echo "file=wavestr" >> "$GITHUB_OUTPUT"
          fi
          if [ "$WAVESTR_BETA" = "1" ]; then echo "tag=wavestr-beta" >> "$GITHUB_OUTPUT"; elif [ "$RELEASE" = "true" ]; then echo "tag=v$v" >> "$GITHUB_OUTPUT"; fi

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match wavestrVersion ${{ steps.v.outputs.version }}"; exit 1
          fi

      - name: Signing key
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/wavestr.jks"
            echo "WAVESTR_KEYSTORE=$RUNNER_TEMP/wavestr.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key: building a debug APK and publishing nothing."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (signed)
        if: steps.key.outputs.signed == 'true'
        env:
          WAVESTR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WAVESTR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WAVESTR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in WAVESTR_KEYSTORE_PASSWORD WAVESTR_KEY_ALIAS WAVESTR_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing signing secret for $v"; exit 1; fi
          done
          # Diagnostics without showing secrets: file size and type, whether the password opens it and which aliases it holds.
          echo "Keystore: $(stat -c %s "$WAVESTR_KEYSTORE") bytes · $(file -b "$WAVESTR_KEYSTORE" | cut -c1-60)"
          if ! keytool -list -keystore "$WAVESTR_KEYSTORE" -storepass "$WAVESTR_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/kt.out" 2>&1; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD does not open the keystore (or ANDROID_KEYSTORE_BASE64 is not a valid keystore): $(grep -i 'error' "$RUNNER_TEMP/kt.out" | head -c 300)"; exit 1
          fi
          aliases=$(grep -iE 'PrivateKeyEntry' "$RUNNER_TEMP/kt.out" | cut -d, -f1 | tr '\n' ' ')
          if ! keytool -list -keystore "$WAVESTR_KEYSTORE" -storepass "$WAVESTR_KEYSTORE_PASSWORD" -alias "$WAVESTR_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::ANDROID_KEY_ALIAS does not match. Aliases in the keystore: $aliases"; exit 1
          fi
          ./gradlew assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}.apk"

      - name: Build (debug)
        if: steps.key.outputs.signed != 'true'
        run: |
          ./gradlew assembleDebug --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}-debug.apk"

      # Without a key, we still check that the release build (with R8) compiles.
      - name: Check release build (R8, unsigned)
        if: steps.key.outputs.signed != 'true'
        run: ./gradlew assembleRelease --stacktrace

      - name: Certificate SHA-256 fingerprint
        if: steps.key.outputs.signed == 'true'
        run: |
          f=$(ls dist/*.apk); bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs "$f" | grep -i sha-256 | tee dist/firma-sha256.txt
          rm -f "$RUNNER_TEMP/wavestr.jks"

      - name: APK permissions
        run: |
          f=$(ls dist/*.apk); bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/aapt2" dump permissions "$f" | tee dist/permisos.txt
          if grep -E "STORAGE|LOCATION|CAMERA|RECORD_AUDIO|CONTACTS" dist/permisos.txt; then echo "::error::Unexpected permission"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}-android
          path: dist/
          if-no-files-found: error

  # APK startup test on an emulator: installs, opens and checks that it doesn't close.
  android-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: "*-android"
          merge-multiple: true
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Start on the emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./scripts/android_smoke.sh


  # Desktop: Compose Desktop + VLC. Each OS builds its own installer.
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      WAVESTR_BETA: ${{ github.ref == 'refs/heads/beta' && '1' || '' }}
      WAVESTR_BETA_N: ${{ github.run_number }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Build errors as annotations
        run: echo "::add-matcher::.github/kotlin-matcher.json"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Version
        id: v
        run: |
          v="$(sed -n 's/^val wavestrVersion = "\(.*\)"/\1/p' app/build.gradle.kts)"
          if [ "$WAVESTR_BETA" = "1" ]; then
            echo "version=$v-beta.$WAVESTR_BETA_N" >> "$GITHUB_OUTPUT"; echo "file=wavestr-beta" >> "$GITHUB_OUTPUT"
          else
            echo "version=$v" >> "$GITHUB_OUTPUT"; echo "file=wavestr" >> "$GITHUB_OUTPUT"
          fi

      - name: Install VLC and xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends vlc-bin vlc-plugin-base vlc-plugin-video-output xvfb > /dev/null

      - name: Startup test (xvfb + VLC)
        if: runner.os == 'Linux'
        run: |
          ./gradlew :desktop:classes -q
          rm -f /tmp/wavestr_hs_err.log
          code=0
          WAVESTR_SMOKE=1 timeout -k 10 240 xvfb-run -a -s "-screen 0 1280x900x24" ./gradlew --no-daemon :desktop:run > "$RUNNER_TEMP/smoke.log" 2>&1 || code=$?
          grep -E "^::" "$RUNNER_TEMP/smoke.log" | grep -v "Escritorio paso" || echo "::warning::The startup test left no results"
          if [ -f /tmp/wavestr_hs_err.log ]; then
            frames=$( (grep -E "^# C|^Current thread" /tmp/wavestr_hs_err.log; grep -A14 -E "^Native frames" /tmp/wavestr_hs_err.log | tail -n +2) | head -18 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning::Fallo nativo%0A$frames"
          fi
          [ "$code" = 0 ] || echo "::warning::The startup test ended with code $code"

      - name: Linux (.deb and .tar.gz)
        if: runner.os == 'Linux'
        run: |
          ./gradlew :desktop:packageDeb :desktop:createDistributable --stacktrace
          mkdir -p dist
          cp desktop/build/compose/binaries/main/deb/*.deb "dist/${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}-linux-amd64.deb"
          tar -C desktop/build/compose/binaries/main/app -czf "dist/${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}-linux-x64.tar.gz" .

      - name: Windows (.msi)
        if: runner.os == 'Windows'
        run: |
          ./gradlew :desktop:packageMsi --stacktrace
          mkdir -p dist
          cp desktop/build/compose/binaries/main/msi/*.msi "dist/${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}-windows-x64.msi"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: dist/
          if-no-files-found: error

  # Publishes (beta or release) only if everything went well: tests, build, emulator startup and installers.
  publish:
    # Beta: APK + desktop (Linux and Windows) if their builds succeeded. Stable: only the APK for now.
    needs: [build, android-smoke, desktop]
    if: >-
      always() && needs.build.result == 'success' && needs.android-smoke.result == 'success' &&
      needs.build.outputs.tag != '' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: "*-android"
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v7
        if: needs.build.outputs.tag == 'wavestr-beta'
        continue-on-error: true
        with:
          pattern: "desktop-*"
          merge-multiple: true
          path: dist
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ls -la dist
          files=$(ls dist/*.apk)
          if [ "$TAG" = "wavestr-beta" ]; then
            files="$files $(ls dist/*.deb dist/*.tar.gz dist/*.msi 2>/dev/null | tr '\n' ' ')"
            # Beta: a single "Wavestr Beta" pre-release rebuilt on every push; it doesn't count as the latest version.
            gh release delete wavestr-beta --cleanup-tag --yes || true
            printf '%s\n\n%s\n' "**Test version** $VERSION · $(git log -1 --format=%s)" \
              "Installs as a separate app, \"Wavestr Beta\", with its own data: it doesn't touch the regular Wavestr. It may have bugs." > notas.md
            if ls dist/*.deb dist/*.msi > /dev/null 2>&1; then
              printf '\n%s\n' "**Desktop (beta):** Linux \`.deb\` or \`.tar.gz\` and Windows \`.msi\`. Needs VLC installed." >> notas.md
            fi
            gh release create wavestr-beta $files --prerelease --target "$GITHUB_SHA" --title "Wavestr Beta $VERSION" --notes-file notas.md
          else
            awk -v v="$VERSION" '$0 ~ "^## " v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notas.md
            printf '\n---\nCertificate fingerprint: `%s`\n' "$(sed 's/.*: //' dist/firma-sha256.txt)" >> notas.md
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" $files --clobber
              gh release edit "$TAG" --title "Wavestr $VERSION" --notes-file notas.md
            else
              gh release create "$TAG" $files --target "$GITHUB_SHA" --title "Wavestr $VERSION" --notes-file notas.md --latest
            fi
          fi

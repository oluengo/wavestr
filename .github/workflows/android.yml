name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Errores de compilación como anotaciones
        run: echo "::add-matcher::.github/kotlin-matcher.json"

      - name: Comprobar traducciones (ca/es/en)
        run: python3 scripts/check_strings.py

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: radiostr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

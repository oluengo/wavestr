# Compila Radiostr (Android).
# - Push a main / pull request: tests, traducciones y APK en «Artifacts».
# - Push a la rama beta: «Radiostr Beta», otra app (io.github.oluengo.radiostr.beta) con sus propios datos,
#   versión X.Y.Z-beta.N. Se publica como pre-release «Radiostr Beta» (etiqueta radiostr-beta, se rehace en cada push).
# - Etiqueta v* (p. ej. v0.1.0, igual que radiostrVersion en app/build.gradle.kts): Release con el APK firmado.
#   De ahí lo recogen Obtainium y Zapstore.
# Firma: secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# (los mismos nombres que en Usus). Sin ellos se genera un APK de depuración y no se publica nada.
name: Android

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RADIOSTR_BETA: ${{ github.ref == 'refs/heads/beta' && '1' || '' }}
      RADIOSTR_BETA_N: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - name: Errores de compilación como anotaciones
        run: echo "::add-matcher::.github/kotlin-matcher.json"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Comprobar traducciones (ca/es/en)
        run: python3 scripts/check_strings.py

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Versión
        id: v
        run: |
          v="$(sed -n 's/^val radiostrVersion = "\(.*\)"/\1/p' app/build.gradle.kts)"
          if [ "$RADIOSTR_BETA" = "1" ]; then
            echo "version=$v-beta.$RADIOSTR_BETA_N" >> "$GITHUB_OUTPUT"; echo "file=radiostr-beta" >> "$GITHUB_OUTPUT"
          else
            echo "version=$v" >> "$GITHUB_OUTPUT"; echo "file=radiostr" >> "$GITHUB_OUTPUT"
          fi

      - name: Comprobar que la etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con radiostrVersion ${{ steps.v.outputs.version }}"; exit 1
          fi

      - name: Clave de firma
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/radiostr.jks"
            echo "RADIOSTR_KEYSTORE=$RUNNER_TEMP/radiostr.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sin clave de firma: se genera un APK de depuración y no se publica nada."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar (firmado)
        if: steps.key.outputs.signed == 'true'
        env:
          RADIOSTR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RADIOSTR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RADIOSTR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in RADIOSTR_KEYSTORE_PASSWORD RADIOSTR_KEY_ALIAS RADIOSTR_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secret de firma correspondiente a $v"; exit 1; fi
          done
          if ! keytool -list -keystore "$RADIOSTR_KEYSTORE" -storepass "$RADIOSTR_KEYSTORE_PASSWORD" -alias "$RADIOSTR_KEY_ALIAS" > /dev/null 2> "$RUNNER_TEMP/kt.err"; then
            echo "::error::La clave no abre con esos secrets: $(head -c 300 "$RUNNER_TEMP/kt.err" | tr '\n' ' ')"; exit 1
          fi
          ./gradlew assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}.apk"

      - name: Compilar (depuración)
        if: steps.key.outputs.signed != 'true'
        run: |
          ./gradlew assembleDebug --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}-debug.apk"

      # Sin clave, comprobamos igualmente que la versión release (con R8) compila.
      - name: Comprobar release (R8, sin firmar)
        if: steps.key.outputs.signed != 'true'
        run: ./gradlew assembleRelease --stacktrace

      - name: Huella SHA-256 del certificado
        if: steps.key.outputs.signed == 'true'
        run: |
          f=$(ls dist/*.apk); bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs "$f" | grep -i sha-256 | tee dist/firma-sha256.txt
          rm -f "$RUNNER_TEMP/radiostr.jks"

      - name: Permisos del APK
        run: |
          f=$(ls dist/*.apk); bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/aapt2" dump permissions "$f" | tee dist/permisos.txt
          if grep -E "STORAGE|LOCATION|CAMERA|RECORD_AUDIO|CONTACTS" dist/permisos.txt; then echo "::error::Permiso no esperado"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}-android
          path: dist/
          if-no-files-found: error

      - name: Release de GitHub
        if: startsWith(github.ref, 'refs/tags/v') && steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## " v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > "$RUNNER_TEMP/notas.md"
          printf '\n---\nHuella del certificado: `%s`\n' "$(sed 's/.*: //' dist/firma-sha256.txt)" >> "$RUNNER_TEMP/notas.md"
          gh release create "$GITHUB_REF_NAME" dist/*.apk --title "Radiostr $v" --notes-file "$RUNNER_TEMP/notas.md"

      # Beta: una sola pre-release «Radiostr Beta» (etiqueta radiostr-beta) que se rehace en cada push; no cuenta como última versión.
      - name: Pre-release beta
        if: env.RADIOSTR_BETA == '1' && steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete radiostr-beta --cleanup-tag --yes || true
          printf '%s\n\n%s\n' "**Versión de pruebas** ${{ steps.v.outputs.version }} · $(git log -1 --format=%s)" \
            "Se instala como otra app, «Radiostr Beta», con sus propios datos: no toca la Radiostr normal. Puede tener fallos." > "$RUNNER_TEMP/beta.md"
          gh release create radiostr-beta dist/*.apk --prerelease --target "$GITHUB_SHA" --title "Radiostr Beta ${{ steps.v.outputs.version }}" --notes-file "$RUNNER_TEMP/beta.md"

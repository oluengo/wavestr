# Publishes the site/ folder on GitHub Pages (https://oluengo.github.io/wavestr/).
# Landing (index.html), share links (s/) and the web app (app/, built from web/). Requires Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "web/**", "app/src/main/res/values*/strings.xml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app
        working-directory: web
        run: npm ci && npm run build
      - run: rm -rf site/app && cp -r web/dist site/app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

name: Release

# Al subir una etiqueta v0.1.0, v0.2.0… compila el APK firmado y crea la release en GitHub
# (de ahí lo recogen Obtainium y Zapstore).
# Secrets necesarios: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Falta el secret KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/radiostr.jks"
          echo "RADIOSTR_KEYSTORE=$RUNNER_TEMP/radiostr.jks" >> "$GITHUB_ENV"

      - name: Compilar APK release
        env:
          RADIOSTR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RADIOSTR_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RADIOSTR_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 scripts/check_strings.py
          ./gradlew testReleaseUnitTest assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "radiostr-${GITHUB_REF_NAME}.apk"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "radiostr-${GITHUB_REF_NAME}.apk" --title "Radiostr $GITHUB_REF_NAME" --generate-notes

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Wavestr</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: una pantalla de móvil centrada (marco en escritorio), tabs abajo, reproductor como hoja a pantalla completa, paneles inferiores para zap y cartera */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --fg:#17201d; --muted:#61706b; --line:#e1e7e4;
  --accent:#0e7c6b; --accent-soft:#dcefea; --live:#e5483b; --frame:#e7ecea;
  --zap:#f5a623; --zap-soft:#fdf1dc; --zap-ink:#a86a00; --scrim:rgba(10,15,13,.45);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211e; --fg:#e8eeeb; --muted:#93a39d; --line:#2a3531;
  --accent:#3fbfa6; --accent-soft:#1d332e; --live:#ff6b5e; --frame:#0b0f0e;
  --zap:#f5b342; --zap-soft:#33281a; --zap-ink:#f5b342; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211e; --fg:#e8eeeb; --muted:#93a39d; --line:#2a3531;
  --accent:#3fbfa6; --accent-soft:#1d332e; --live:#ff6b5e; --frame:#0b0f0e;
  --zap:#f5b342; --zap-soft:#33281a; --zap-ink:#f5b342; --scrim:rgba(0,0,0,.6); color-scheme:dark}
[hidden]{display:none!important}
:root[data-accent="green"]{--accent:#0e7c6b;--accent-soft:#dcefea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-accent="green"]{--accent:#3fbfa6;--accent-soft:#1d332e}}
:root[data-theme="dark"][data-accent="green"]{--accent:#3fbfa6;--accent-soft:#1d332e}
:root[data-accent="violet"]{--accent:#6d28d9;--accent-soft:#ede6fb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-accent="violet"]{--accent:#a78bfa;--accent-soft:#2a2142}}
:root[data-theme="dark"][data-accent="violet"]{--accent:#a78bfa;--accent-soft:#2a2142}
:root[data-accent="coral"]{--accent:#d9480f;--accent-soft:#fde9df}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-accent="coral"]{--accent:#ff8a5b;--accent-soft:#3a2318}}
:root[data-theme="dark"][data-accent="coral"]{--accent:#ff8a5b;--accent-soft:#3a2318}
:root[data-accent="blue"]{--accent:#1d4ed8;--accent-soft:#e1e9fc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-accent="blue"]{--accent:#7ea6ff;--accent-soft:#1b2542}}
:root[data-theme="dark"][data-accent="blue"]{--accent:#7ea6ff;--accent-soft:#1b2542}
:root[data-accent="raspberry"]{--accent:#be185d;--accent-soft:#fbe4ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-accent="raspberry"]{--accent:#f472b6;--accent-soft:#3b1a2b}}
:root[data-theme="dark"][data-accent="raspberry"]{--accent:#f472b6;--accent-soft:#3b1a2b}
.sw-acc{display:flex;gap:8px}.sw-acc button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;outline:2px solid transparent}.sw-acc button.on{outline:2px solid var(--fg);outline-offset:1px}
html,body{height:100%}
body{background:var(--frame);color:var(--fg);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box;
  display:flex;justify-content:center}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.phone{position:relative;width:100%;max-width:400px;height:100%;max-height:820px;background:var(--bg);border-radius:28px;overflow:hidden;
  display:flex;flex-direction:column;border:1px solid var(--line)}
header.top{padding:20px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:26px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:13px}
main{flex:1;overflow-y:auto;padding:4px 20px 150px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 10px;font-weight:600;display:flex;justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;background:var(--surface)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.feature{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;width:100%;display:block}
.thumb{aspect-ratio:16/9;max-width:100%;position:relative}
.thumb .badge{position:absolute;top:10px;left:10px}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--live);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;letter-spacing:.04em}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.viewers{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;font-family:var(--mono)}
.feature .meta{padding:12px 14px;display:grid;gap:3px}
.title{font-weight:600}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.cover{width:52px;height:52px;border-radius:12px;flex:none;position:relative}
.cover.sm::after{content:"";position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--live);border:2px solid var(--bg)}
.row .txt{min-width:0;flex:1}
.row .txt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kind{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.sats{font-family:var(--mono);font-size:12px;color:var(--zap-ink)}
.empty-note{font-size:12px;color:var(--muted);margin-top:14px}
/* mini player + tabs */
.dock{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line)}
.mini{display:flex;align-items:center;gap:10px;margin:8px 10px 0;padding:8px;border-radius:14px;background:var(--surface);border:1px solid var(--line);width:calc(100% - 20px);text-align:left}
.mini .cover{width:40px;height:40px;border-radius:9px}
.mini .txt{flex:1;min-width:0}
.mini .txt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.mode-pill{font-size:11px;font-family:var(--mono);color:var(--accent)}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.iconbtn.fill{background:var(--fg);color:var(--bg)}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(10px + env(safe-area-inset-bottom,0px))}
nav.tabs button{display:grid;justify-items:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 0}
nav.tabs button.on{color:var(--accent);font-weight:600}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* player sheet */
.sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:5;overflow-y:auto}
.sheet.open{transform:none}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 6px}
.stage{margin:6px 16px 0;border-radius:18px;overflow:hidden;aspect-ratio:16/9;max-width:100%;position:relative;background:#000;flex:none}
.stage canvas{width:100%;height:100%;display:block}
.stage.audio{aspect-ratio:1/1;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.art{width:58%;aspect-ratio:1;border-radius:22px;position:relative;display:grid;place-items:end center;padding-bottom:16%}
.bars{display:flex;gap:4px;align-items:flex-end;height:34px}
.bars i{width:5px;border-radius:3px;background:rgba(255,255,255,.9);animation:b 1s ease-in-out infinite}
@keyframes b{0%,100%{height:25%}50%{height:100%}}
.bars.paused i{animation-play-state:paused}
.toggle{margin:16px 16px 0;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.toggle button{padding:10px;border-radius:10px;display:flex;justify-content:center;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--muted)}
.toggle button.on{background:var(--fg);color:var(--bg)}
.hint{margin:10px 18px 0;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.hint b{color:var(--fg);font-weight:600}
.pinfo{padding:14px 18px 0;display:grid;gap:4px}
.pinfo h2{font-family:var(--display);font-size:21px;margin:0;font-weight:700;text-wrap:balance}
.controls{display:flex;justify-content:center;align-items:center;gap:22px;padding:16px 0 6px}
.controls .big{width:62px;height:62px}
.controls .big svg{width:26px;height:26px}
.zapbtn{color:var(--zap-ink);background:var(--zap-soft)}
.chat{margin:8px 16px 16px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:7px;font-size:13px}
.chat span{color:var(--accent);font-weight:600;margin-right:4px}
.chat .z{background:var(--zap-soft);border-radius:8px;padding:6px 8px}
.chat .z b{color:var(--zap-ink);font-family:var(--mono);font-weight:500}
/* settings */
.set{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.set .row{justify-content:space-between}
.sw{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--accent)}.sw.on::after{left:21px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;font-size:12px}
.seg button{padding:5px 9px}.seg button.on{background:var(--fg);color:var(--bg)}
/* android auto */
.auto{background:#0d1110;color:#e8eeeb;border-radius:16px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.auto .cover{width:72px;height:72px}
.auto small{color:#93a39d;font-size:12px}
.auto .lst{grid-column:1/-1;display:grid;gap:8px;font-size:13px;border-top:1px solid #2a3531;padding-top:10px}
.lock{position:absolute;inset:0;background:#050807;color:#e8eeeb;z-index:9;display:flex;flex-direction:column;align-items:center;padding:60px 20px 30px;gap:14px}
.lock .clock{font-family:var(--display);font-size:64px;font-weight:500}
.lock .card{background:#1a2220;border-radius:18px;padding:14px;width:100%;display:flex;gap:12px;align-items:center}
.lock .card .cover{width:48px;height:48px}
.lock p{font-size:12px;color:#93a39d;text-align:center;margin-top:auto}
/* zap + cartera */
.ov{position:absolute;inset:0;background:var(--scrim);z-index:8;display:flex;align-items:flex-end}
.panel{background:var(--surface);width:100%;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-height:92%;overflow-y:auto}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel h3{font-family:var(--display);margin:0;font-size:19px;font-weight:700}
.amts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.amt{border:1px solid var(--line);border-radius:12px;padding:10px 0;text-align:center;font-family:var(--mono);font-size:14px;background:var(--bg)}
.amt.on{border-color:var(--zap);background:var(--zap-soft)}
input.field{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:11px 12px;font:inherit;font-size:14px}
.cta{background:var(--zap);color:#1b1300;font-weight:700;border-radius:14px;padding:14px;font-size:15px;width:100%}
.cta.alt{background:var(--fg);color:var(--bg)}
.cta:disabled{opacity:.6;cursor:default}
.wallet{display:flex;align-items:center;gap:10px;font-size:13px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.link{color:var(--accent);font-weight:600;font-size:13px}
.inv{font-family:var(--mono);font-size:12px;word-break:break-all;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;color:var(--muted)}
.err{color:var(--live);font-size:12px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;z-index:10;max-width:90%;text-align:center}
/* sorpresa */
.menu{position:absolute;top:64px;right:14px;z-index:7;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 10px 28px rgba(0,0,0,.14);display:grid;min-width:230px}
.menu button{display:grid;text-align:left;padding:10px 12px;border-radius:10px;gap:2px}
.menu button:hover{background:var(--bg)}
.spin{background:var(--surface);border-radius:22px;padding:22px;display:grid;justify-items:center;gap:12px;margin:auto;width:76%;text-align:center}
.spin .cover{width:120px;height:120px;border-radius:24px;transition:background .08s}
.spin .name{font-family:var(--display);font-size:20px;font-weight:700;min-height:1.3em}
/* perfil y emisora */
.page{position:absolute;inset:0;background:var(--bg);z-index:6;overflow-y:auto;padding-bottom:30px}
.pbanner{height:120px;position:relative}
.pbanner .back{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.35);color:#fff}
.pbody{padding:0 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.pbody>*{min-width:0}
.pav{position:relative;width:84px;height:84px;border-radius:50%;border:4px solid var(--bg);margin-top:-42px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:28px;font-weight:700}
.pav.sq{border-radius:20px}
.pname{font-family:var(--display);font-size:24px;font-weight:700;margin:0;text-wrap:balance}
.ok{color:var(--accent);font-weight:600}
.about{margin:0;line-height:1.5;font-size:14px;max-width:65ch}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px}
.stats b{font-family:var(--mono);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.pbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pbtns .cta{padding:11px;font-size:14px}
.pbody .label{margin:8px 0 0}
.urlbox{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px}
.urlbox code{font-family:var(--mono);font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hostlink{color:var(--muted);font-size:13px;text-align:left;padding:0}
.hostlink b{color:var(--accent);font-weight:600}
.faved svg{fill:var(--live);stroke:var(--live)}
/* carpetas */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-top:4px}
.crumbs button{color:var(--accent);font-weight:600;padding:2px 0}
.crumbs button:last-child{color:var(--fg)}
.fold{display:flex;gap:12px;align-items:center;flex:1;min-width:0;text-align:left}
.ficon{width:52px;height:52px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.more{color:var(--muted);font-size:18px;letter-spacing:1px}
.label .link{text-transform:none;letter-spacing:0;font-size:13px}
.dest{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left;width:100%}
.dest.on{border-color:var(--accent);background:var(--accent-soft)}
.dest svg{width:18px;height:18px;color:var(--accent)}
.danger{color:var(--live);font-weight:600;font-size:14px;text-align:left}
/* calidad */
.qrow{display:flex;justify-content:space-between;align-items:center;margin:10px 18px 0;gap:10px}
.qchip{font-family:var(--mono);font-size:12px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.qchip:disabled{cursor:default;color:var(--muted)}
.qopt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;width:100%}
.qopt.on{border-color:var(--accent);background:var(--accent-soft)}
.qopt .kind{font-variant-numeric:tabular-nums}
.donb{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;text-align:left;border-bottom:1px solid var(--line)}
.donb:last-child{border-bottom:0}
.dico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-style:normal;flex:none}
.donb .mono{display:block;font-family:var(--mono);font-size:12px;color:var(--muted)}
.lic{font-family:var(--mono);font-size:10px;line-height:1.35;white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px;margin:8px 0 0;max-height:180px;overflow:auto}
details.lic-d summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:10px}
.verb{font-family:var(--mono);font-size:12px;color:var(--muted)}
button.avatar{cursor:pointer}
.avatar.out{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.avatar svg{width:18px;height:18px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:10px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;padding:11px 0;outline:none}
.chips button.chip{font:inherit;font-size:13px;color:inherit;cursor:pointer}
.chips .chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tagcloud{display:flex;flex-wrap:wrap;gap:8px}
.tagcloud button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.tagcloud button small{color:var(--muted);font-family:var(--mono);margin-left:4px}
.warnb{font-size:11px;padding:2px 7px;border-radius:5px;background:color-mix(in srgb,var(--live) 14%,transparent);color:var(--live);font-weight:600;white-space:nowrap}
.httpb{font-size:10px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);font-family:var(--mono)}
.imp-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.imp-tabs button{padding:8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.imp-tabs button.on{background:var(--fg);color:var(--bg)}
textarea.field{min-height:110px;resize:vertical;font-family:var(--mono);font-size:12px;line-height:1.4}
.found{display:grid;gap:4px;max-height:220px;overflow:auto}
.found label{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:13px}
.found label span{flex:1;min-width:0}
.found label small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select.field,textarea.field{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:11px 12px;font:inherit;font-size:14px}

}

function player(){

  $("qChip").disabled=single;
  $("pTitle").textContent=s.title;
  $("pHost").innerHTML=isRadio?`${esc(s.host)} · <b>${t("Ver emisora ›")}</b>`:`${esc(s.host)} · <b>${t("Ver perfil ›")}</b>`;

  mini();
}

function draw(ts){
  if(!ctx) return; const w=640,h=360;
  const g=ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,`hsl(${165+Math.sin(ts/2000)*20},55%,28%)`); g.addColorStop(1,`hsl(${200+Math.cos(ts/2500)*25},45%,45%)`);
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  ctx.fillStyle="rgba(255,255,255,.12)";
  ctx.beginPath(); ctx.arc(w*.35+Math.sin(ts/1400)*30,h*.6,70,0,7); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.8)"; ctx.font="600 22px Figtree,sans-serif"; ctx.fillText("Vídeo del directo (simulado)",24,40);
  if(S.playing && !matchMedia("(prefers-reduced-motion: reduce)").matches) raf=requestAnimationFrame(draw);
}

function hostOf(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(_){ return u.slice(0,40); } }
/* Lector de listas: PLS ([playlist] FileN/TitleN), M3U/M3U8 (#EXTINF + URL) o una URL suelta. */
function parsePlaylist(txt){
  const lines=String(txt).replace(/\r/g,"").split("\n").map(l=>l.trim()).filter(Boolean);
  const out=[]; let kind="M3U";
  if(/^\[playlist\]$/i.test(lines[0]||"")){
    kind="PLS"; const files={}, titles={};
    lines.forEach(l=>{ let m=l.match(/^File(\d+)=(.+)$/i); if(m) files[m[1]]=m[2].trim(); m=l.match(/^Title(\d+)=(.*)$/i); if(m) titles[m[1]]=m[2].trim(); });
    Object.keys(files).sort((a,b)=>a-b).forEach(k=>out.push({title:titles[k]||hostOf(files[k]),url:files[k]}));
  } else {
    if(lines.some(l=>l.startsWith("#EXT-X-"))) kind="M3U8";
    let pending=null;
    lines.forEach(l=>{
      if(l.toUpperCase().startsWith("#EXTINF")){ const c=l.indexOf(","); pending=c>=0?l.slice(c+1).trim():null; }
      else if(!l.startsWith("#")&&/^https?:\/\//i.test(l)){ out.push({title:pending||hostOf(l),url:l}); pending=null; }
    });
    if(kind==="M3U8"&&lines.some(l=>l.startsWith("#EXT-X-STREAM-INF")||l.startsWith("#EXT-X-TARGETDURATION"))) return {kind,items:[],hls:true};
  }
  const seen=new Set();
  return {kind,items:out.filter(x=>!seen.has(x.url)&&seen.add(x.url))};
}

  const auto=qCurrent({...s});
  panel(`${phead(isA?t("Calidad de audio"):t("Calidad de vídeo"))}
    <div class="sub" style="margin-top:-6px">${s.kind?t("{n} formatos que emite {s}",{n:vs.length,s:esc(s.title)}):t("Variantes del directo HLS")}</div>
    <div style="display:grid;gap:6px">
      <button class="qopt ${sel===undefined||sel==="auto"?"on":""}" data-q="auto"><div><div class="title">${t("Auto")}</div><div class="sub">${t("La mejor con wifi, la más ligera con datos")}</div></div><span class="kind">${S.net==="cell"?t("datos"):t("wifi")}</span></button>
      ${vs.map((v,i)=>`<button class="qopt ${sel===i?"on":""}" data-q="${i}"><div><div class="title">${v.label}</div><div class="sub">≈ ${perHour(v.kbps)}</div></div><span class="kind">${v.kbps} kbps</span></button>`).join("")}
    </div>
    <div class="sub" style="font-size:11px">${t("Se recuerda por emisora. Consumo aproximado.")}</div>`,t("Calidad"));
}
function toggleFav(id){ const i=S.favs.indexOf(id); if(i>=0){S.favs.splice(i,1); delete S.loc[id]; toast("Quitado de favoritos");} else {S.favs.push(id); toast("♥ Añadido a favoritos · se sincroniza en Nostr");} }

document.addEventListener("click",e=>{
  const ov=$("ov");
  const menu=$("menu");
  if(!menu.hidden && !e.target.closest("#menu") && !e.target.closest("#dice")) menu.hidden=true;
  if(e.target.closest("#dice")){ menu.hidden=!menu.hidden; return; }
  const rnd=e.target.closest("[data-rand]"); if(rnd){ randomPick(rnd.dataset.rand); return; }
  if(e.target.closest("#meBtn")){ if(S.logged) mePage(); else loginPanel(); return; }
  if(e.target.closest("[data-me]")){ mePage(); return; }
  if(e.target.closest("[data-login]")){ loginPanel(); return; }
  if(e.target.closest("[data-amber]")){ doLogin("amber"); return; }
  if(e.target.closest("[data-npub]")){ const v=($("npubIn").value||"").trim(); if(!/^npub1[02-9ac-hj-np-z]{20,}$/.test(v)){ const x=$("npubErr"); x.textContent=t("Eso no parece un npub. Debe empezar por npub1."); x.hidden=false; return; } S.me.npub=v.slice(0,10)+"…"+v.slice(-4); doLogin("npub"); return; }
  if(e.target.closest("[data-logout]")){ S.logged=false; closePage(); renderMeBtn(); view(); toast(t("Sesión cerrada")); return; }
  const rt=e.target.closest("[data-rtab]"); if(rt){ S.rtab=rt.dataset.rtab; S.rq=""; view(); return; }
  const rg=e.target.closest("[data-rtag]"); if(rg){ S.rtag=S.rtag===rg.dataset.rtag?null:rg.dataset.rtag; $("rList").innerHTML=radioList(); return; }
  if(e.target.closest("[data-import]")){ S.impFound=null; importPanel(); return; }
  const im=e.target.closest("[data-impmode]"); if(im){ S.impMode=im.dataset.impmode; S.impText=$("impText")?.value??S.impText; importPanel(); return; }
  const sm=e.target.closest("[data-sample]"); if(sm){ impParse(sm.dataset.sample==="pls"?SAMPLE_PLS:SAMPLE_M3U); return; }
  if(e.target.closest("[data-parse]")){ impParse($("impText").value); return; }
  if(e.target.closest("[data-impadd]")){ impAdd(); return; }
  if(e.target.closest("[data-ext]")){ toast(t("Se abre en GitHub (demo)")); return; }
  const ac=e.target.closest("[data-acc]"); if(ac){ ACCENT=ac.dataset.acc; applyAccent(); view(); return; }
  const lg=e.target.closest("[data-lang]"); if(lg){ setLang(lg.dataset.lang); return; }
  const th=e.target.closest("[data-th]"); if(th){ S.theme=th.dataset.th; applyTheme(); view(); return; }
  if(e.target.closest("#pHost")){ S.cur.kind?stationPage(S.cur):profilePage(S.cur); return; }
  if(e.target.closest("[data-back]")){ closePage(); return; }
  if(e.target.closest("[data-follow]")){ const id=S.cur.id; S.following.has(id)?S.following.delete(id):S.following.add(id); profilePage(S.cur); toast(S.following.has(id)?t("Sigues a {h}",{h:handle(S.cur)}):t("Has dejado de seguir a {h}",{h:handle(S.cur)})); return; }
  if(e.target.closest("#pZap2")){ zapPanel(); return; }
  const rec=e.target.closest("[data-rec]"); if(rec){ toast(t("▶ Grabación: {s} (demo)",{s:rec.dataset.rec})); return; }
  const cp=e.target.closest("[data-copy]"); if(cp){ const txt=cp.dataset.copy; navigator.clipboard?.writeText(txt).then(()=>toast("Copiado"),()=>toast("No se pudo copiar: mantén pulsado el texto")) ?? toast("Mantén pulsado el texto para copiarlo"); return; }
  const fs=e.target.closest("[data-favst]"); if(fs){ toggleFav(fs.dataset.favst); stationPage(S.cur); return; }
  const sim=e.target.closest("[data-similar]"); if(sim){ const tag=sim.dataset.similar; const pool=allRadios.filter(r=>r.id!==S.cur.id&&r.tags.some(t=>S.cur.tags.includes(t))); const pick=(pool.length?pool:allRadios.filter(r=>r.id!==S.cur.id))[Math.floor(Math.random()*(pool.length||allRadios.length-1))]; closePage(); S.cur=pick; S.playing=true; player(); toast(t("🎲 Parecida: {s}",{s:pick.title+" · "+t(pick.country)})); return; }
  if(e.target.closest("[data-report]")){ toast("Gracias. Lo revisaremos en el directorio."); return; }
  if(e.target.closest("#pFav")){ toggleFav(S.cur.id); player(); view(); return; }
  /* carpetas */
  const fo=e.target.closest("[data-fold]"); if(fo){ S.favPath=fo.dataset.fold||null; view(); return; }
  if(e.target.closest("[data-newfold]")){ newFoldPanel(); return; }
  if(e.target.closest("#foldCreate")){ const n=$("foldName").value.trim(); if(!n){const x=$("fErr");x.textContent="Escribe un nombre para la carpeta.";x.hidden=false;return;}
    S.folders.push({id:"f"+Date.now(),name:n,parent:S.favPath}); closeOv(); view(); toast(t("Carpeta «{n}» creada",{n})); return; }
  const fm=e.target.closest("[data-foldmenu]"); if(fm){ foldMenu(fm.dataset.foldmenu); return; }
  const rn=e.target.closest("[data-rename]"); if(rn){ const n=$("foldRename").value.trim(); if(!n) return; S.folders.find(f=>f.id===rn.dataset.rename).name=n; closeOv(); view(); toast("Nombre guardado"); return; }
  const ad=e.target.closest("[data-askdel]"); if(ad){ $("delBox").innerHTML=`<div class="sub" style="margin-bottom:8px">${t("¿Seguro? Esta acción no se puede deshacer.")}</div><div class="pbtns"><button class="cta alt" data-close>${t("Cancelar")}</button><button class="cta" style="background:var(--live);color:#fff" data-del="${ad.dataset.askdel}">${t("Eliminar")}</button></div>`; return; }
  const dl=e.target.closest("[data-del]"); if(dl){ const f=S.folders.find(x=>x.id===dl.dataset.del);
    S.folders.forEach(x=>{if(x.parent===f.id)x.parent=f.parent;}); Object.keys(S.loc).forEach(k=>{if(S.loc[k]===f.id){ if(f.parent) S.loc[k]=f.parent; else delete S.loc[k]; }});
    S.folders=S.folders.filter(x=>x!==f); if(S.favPath===f.id) S.favPath=f.parent; closeOv(); view(); toast(t("Carpeta «{n}» eliminada",{n:f.name})); return; }
  const mv=e.target.closest("[data-move]"); if(mv){ movePanel(parseId(mv.dataset.move)); return; }
  const mt=e.target.closest("[data-moveto]"); if(mt){ const id=parseId(mt.dataset.id), to=mt.dataset.moveto||null; if(to) S.loc[id]=to; else delete S.loc[id];
    closeOv(); view(); toast(t("Movido a «{n}»",{n:to?S.folders.find(f=>f.id===to).name:t("Sin carpeta")})); return; }
  const uf=e.target.closest("[data-unfav]"); if(uf){ toggleFav(parseId(uf.dataset.unfav)); closeOv(); view(); player(); return; }
  /* calidad */
  if(e.target.closest("#qChip")){ qPanel(); return; }
  const qo=e.target.closest("[data-q]"); if(qo){ const v=qo.dataset.q; S.q[qKey(S.cur)]=v==="auto"?"auto":+v; closeOv(); player(); toast(t("Calidad: {l}",{l:qCurrent(S.cur).v.label+(v==="auto"?" (auto)":"")})); return; }
  if(e.target===ov){closeOv();return;}
  if(e.target.closest("[data-close]")){closeOv();return;}
  const a=e.target.closest("[data-amt]"); if(a){ $("zCustom").value=""; setAmt(+a.dataset.amt); $("zErr").hidden=true; return; }
  const bd=e.target.closest("[data-bud]"); if(bd){ S.budget=+bd.dataset.bud; document.querySelectorAll("[data-bud]").forEach(x=>x.classList.toggle("on",x===bd)); return; }
  if(e.target.closest("[data-nwc]")){ nwcPanel(ov.hidden?"settings":"zap"); return; }
  if(e.target.closest("[data-nwcoff]")){ S.nwc=null; view(); toast("Cartera desconectada"); return; }
  const df=e.target.closest("[data-def]"); if(df){ S.zapAmt=+df.dataset.def; view(); return; }
  if(e.target.closest("#nwcGo")){
    const u=$("nwcUri").value.trim();
    if(!u.startsWith("nostr+walletconnect://")){ const n=$("nErr"); n.textContent="El enlace debe empezar por nostr+walletconnect://. Cópialo de nuevo desde tu cartera."; n.hidden=false; return; }
    S.nwc={name:"Alby Hub",budget:S.budget,left:S.budget};
    if(afterNwc==="zap"){ zapPanel(); } else { closeOv(); }
    view(); toast("Cartera conectada"); return;
  }
  if(e.target.closest("#zSend")){ sendZap(); return; }
  if(e.target.closest("#zOpen")){ const b=$("zOpen"); b.disabled=true; b.textContent="Esperando el pago… se detecta el recibo del zap"; const p=window._pending; setTimeout(()=>done(p.amt,p.msg),1400); return; }
  if(e.target.closest("#pZap")){ zapPanel(); return; }
  const tb=e.target.closest("[data-t]"); if(tb){S.tab=tb.dataset.t;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b===tb));view();return;}
  const s=e.target.closest("[data-s]"); if(s){S.cur=streams.find(x=>x.id==s.dataset.s);S.playing=true;open();return;}
  const r=e.target.closest("[data-r]"); if(r){S.cur=allRadios.find(x=>x.id==r.dataset.r);S.playing=true;open();return;}
  const n=e.target.closest("[data-net]"); if(n){S.net=n.dataset.net;view();player();return;}
  if(e.target.closest("#sw1")){S.autoAudioOff=!S.autoAudioOff;view();return;}
  if(e.target.closest("#sw2")){S.cellAudio=!S.cellAudio;view();player();return;}
  if(e.target.closest("#miniPlay")||e.target.closest("#lockPlay")){e.stopPropagation();S.playing=!S.playing;player();return;}
  if(e.target.closest("#mini")){open();return;}
});
document.addEventListener("change",e=>{
  if(e.target.id==="rCountry"){ S.rcountry=e.target.value; $("rList").innerHTML=radioList(); }
  if(e.target.id==="impFile"){ const file=e.target.files&&e.target.files[0]; if(!file) return;
    const rd=new FileReader(); rd.onload=()=>{ S.impMode="paste"; impParse(String(rd.result).slice(0,200000)); }; rd.onerror=()=>impShowErr(t("No se ha podido leer el archivo.")); rd.readAsText(file); }
});
document.addEventListener("input",e=>{
  if(e.target.id==="rSearch"){ S.rq=e.target.value; $("rList").innerHTML=radioList(); document.querySelectorAll("[data-rtab]").forEach(b=>b.classList.toggle("on",!S.rq&&b.dataset.rtab===S.rtab)); return; }
  if(e.target.id==="zCustom"){ const v=parseInt(e.target.value.replace(/\D/g,""))||0; e.target.value=v||""; if(v){setAmt(v);} else {setAmt(100);} $("zErr").hidden=true; }
});
$("closeSheet").onclick=()=>$("sheet").classList.remove("open");
$("pPlay").onclick=()=>{S.playing=!S.playing;player();};
$("mAudio").onclick=()=>{S.mode="audio";player();};
$("mVideo").onclick=()=>{if(S.cellAudio&&S.net==="cell"){S.net="wifi";} S.mode="video";player();view();};
let before;
$("lockBtn").onclick=()=>{before=S.mode; if(S.autoAudioOff) S.mode="audio"; player(); $("lock").hidden=false;};
$("unlock").onclick=()=>{$("lock").hidden=true; S.mode=before; player();};
applyTheme(); applyAccent(); applyStatic(); renderMeBtn(); view(); mini();
</script>

</body>
</html>

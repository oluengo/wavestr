datastore = "1.1.1"
coil = "2.7.0"
glance = "1.1.1"
junit = "4.13.2"
composeMultiplatform = "1.7.3"
coil3 = "3.0.4"
vlcj = "4.8.3"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }

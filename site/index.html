* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 var(--body); -webkit-text-size-adjust: 100%; }

.wrap { max-width: 70rem; margin: 0 auto; padding: 0 1.25rem; }

.navlink { opacity: .75; } .navlink:hover { opacity: 1; }
.lang { display: flex; gap: .15rem; font-size: .8rem; }

.theme { opacity: .8; display: grid; place-items: center; }

.i-sun { display: none; }

.phones { min-width: 0; }

.phones img:nth-child(3) { transform: translateY(1.5rem); }

.gallery img { border-radius: 28px; }
.gallery figcaption { font-size: .88rem; color: var(--muted); margin-top: .6rem; text-align: center; }

.install { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 1.5rem; }

.card ol { margin: 0 0 1.2rem; padding-left: 1.2rem; }
.card li { margin-bottom: .45rem; }
.card .actions { display: flex; flex-wrap: wrap; gap: .6rem; }
.card .btn.grad { color: #fff; }
.fp { margin-top: 1.2rem; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 1rem 1.25rem; display: grid; gap: .5rem; }
.fp span { font-size: .9rem; color: var(--muted); }
.fp code { font-size: .8rem; background: none; padding: 0; line-height: 1.6; }

.auto { margin-top: 1rem; }
.auto summary { cursor: pointer; font-weight: 600; }
.auto ol { color: var(--muted); }

.privacy { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); padding: 0; margin: 0; list-style: none; }
.privacy li { border-top: 3px solid; border-image: var(--grad) 1; padding-top: 1rem; }
.privacy b { display: block; font: 700 1.15rem var(--head); margin-bottom: .3rem; }
.privacy span { color: var(--muted); font-size: .95rem; }

.faq details { border-bottom: 1px solid var(--line); padding: 1rem 0; }
.faq summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 1rem; }
.faq summary::after { content: "+"; color: var(--accent); font-size: 1.3rem; line-height: 1; }
.faq details[open] summary::after { content: "−"; }
.faq details p { color: var(--muted); margin: .6rem 0 0; }

footer { border-top: 1px solid var(--line); padding: 2.5rem 0 3rem; color: var(--muted); font-size: .9rem; }

.donate { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }

const LANGS = ["ca", "es", "en"], root = document.documentElement;

function pickLang() {

}

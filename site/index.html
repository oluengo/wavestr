<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wavestr</title>
<link rel="icon" href="icon.svg">
<style>
  :root { --bg:#f6f6f9; --ink:#16151d; --mute:#6b6a78; --line:#e7e6ee; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d0c14; --ink:#f2f1f7; --mute:#9a99a8; --line:#2a2935; --card:#17161f; } }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100vh; display:grid; place-items:center; padding:32px 16px; text-align:center; }
  img { width:96px; height:96px; border-radius:24px; }
  h1 { font-size:30px; letter-spacing:-.03em; margin-top:14px; }
  p { color:var(--mute); margin:6px 0 20px; }
  a { display:inline-block; padding:11px 18px; border-radius:12px; font-weight:600; text-decoration:none; color:#fff; background:linear-gradient(135deg,#f59e0b,#e0457b 60%,#c026d3); }
</style>
</head>
<body>
<main>
  <img src="icon.svg" alt="">
  <h1>Wavestr</h1>
  <p>Radio online y streams de Nostr en una sola app para Android.</p>
  <a href="https://github.com/oluengo/wavestr#readme">Ver en GitHub</a>
</main>
</body>
</html>

# Zapstore (store on Nostr). Publishes the APK of each GitHub Release (tags vX.Y.Z, not the beta).
# Publish: `zsp publish` (check first with `zsp check`) with SIGN_WITH=bunker://… in the environment.
# Never store the nsec key here or in the repository.
repository: https://github.com/oluengo/wavestr
release_filter: ^v\d+\.\d+\.\d+$
match: ^wavestr-\d+\.\d+\.\d+\.apk$
metadata_sources: []

name: Wavestr
summary: Online radio and Nostr live streams in one app.
description: |
  Wavestr brings together radio stations from all over the world and live streams from the people you follow on Nostr, with the same favourites and the same player. Free, no ads. In English, Spanish and Catalan.

  **What it does**

  - **Nostr live streams (NIP-53)** from people you follow, or from all of Nostr: audio only or video without cutting the stream, with chat, reactions and zaps.
  - **Online radio** with the free Radio Browser directory (popular, by country, by style and search) and PLS/M3U playlist import.
  - **Favourites in folders and subfolders**, for stations and streamers. Optional: stored on Nostr, encrypted (NIP-78 + NIP-44).
  - **Share** a station, a folder or all favourites by link, M3U or text, or post them on Nostr.
  - **Upcoming and reminders:** scheduled streams (NIP-53) and calendar events (NIP-52), with an alert when they start or before.
  - **Zaps with NWC**, with a monthly limit.
  - **Android Auto**, widgets, previous/next, sleep timer, buffer against dropouts and per-station volume boost.
  - **Surprise button:** radio, stream or both.

  **Privacy**

  - Never sees your private key: sign with Amber (NIP-55) or a bunker (NIP-46), or sign in read-only with your npub.
  - No accounts of its own, no server and no tracking libraries.
  - Favourites are stored on your device; storing them on Nostr is optional and encrypted.

  Built with AI · tested by humans.
license: MIT
website: https://oluengo.github.io/wavestr/
tags: [radio, music, streaming, nostr, livestream, zaps, android-auto]
supported_nips: ["05", "19", "25", "44", "46", "47", "52", "53", "55", "57", "65", "78"]

